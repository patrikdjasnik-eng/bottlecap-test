name: RHAR CPU Tests

on:
  push:
    branches:
      - main
      - feat/reasoning-compression
      - feat/termux-qwen-research-chat
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhar-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q diagnostics tests utils mobile/termux

      - name: Parse Windows PowerShell launchers
        shell: pwsh
        run: |
          $paths = @('desktop/windows/Start-BottleCap.ps1', 'desktop/windows/Stop-BottleCap.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Run RHAR CPU regression tests
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: |
          python -m unittest \
            tests.test_offline_selector \
            tests.test_reasoning_probe \
            tests.test_safe_start_plan \
            tests.test_safe_start_data \
            tests.test_safe_start_overlap \
            tests.test_safe_start_generate \
            tests.test_reasoning_structure \
            tests.test_reasoning_steps \
            tests.test_semantic_repetition \
            tests.test_reasoning_checkpoint \
            tests.test_token_boundaries \
            tests.test_token_trace \
            tests.test_training_candidates \
            tests.test_lora_pilot \
            tests.test_safe_start_rollout_adapter \
            tests.test_reasoning_trace_review \
            tests.test_stress_test_003 \
            tests.test_stress_trace_analyzer \
            tests.test_bottlecap_compliance \
            tests.test_rhar_evaluation_001 \
            tests.test_training_002_preflight \
            tests.test_dataset_builder_002 \
            tests.test_dataset_batch_002 \
            tests.test_rhar_teacher_train_002 \
            tests.test_rhar_train_003 \
            tests.test_rhar_cep_pilot \
            tests.test_rhar_validation_compare \
            tests.test_mobile_termux \
            -v
